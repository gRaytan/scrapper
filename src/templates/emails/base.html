<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>{% block title %}HiddenJobs{% endblock %}</title>
    <!--[if mso]>
    <noscript>
        <xml>
            <o:OfficeDocumentSettings>
                <o:PixelsPerInch>96</o:PixelsPerInch>
            </o:OfficeDocumentSettings>
        </xml>
    </noscript>
    <![endif]-->
    <style type="text/css">
        /* Reset */
        body, table, td, p, a, li { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
        table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
        img { border: 0; height: auto; line-height: 100%; outline: none; text-decoration: none; }
        body { margin: 0 !important; padding: 0 !important; width: 100% !important; }
        a[x-apple-data-detectors] { color: inherit !important; text-decoration: none !important; }
        
        /* Responsive */
        @media screen and (max-width: 600px) {
            .email-container { width: 100% !important; }
            .mobile-padding { padding-left: 16px !important; padding-right: 16px !important; }
            .job-title { font-size: 15px !important; }
            .company-name { font-size: 13px !important; }
        }
    </style>
</head>
<body style="margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; background-color: #FAFAF9;">
    
    <!-- Wrapper -->
    <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="background-color: #FAFAF9;">
        <tr>
            <td align="center" style="padding: 24px 16px;">
                
                <!-- Email Container -->
                <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="560" class="email-container" style="background-color: #ffffff; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);">
                    
                    <!-- Header with Logo -->
                    <tr>
                        <td style="padding: 24px 32px; border-bottom: 1px solid #f3f4f6;" class="mobile-padding">
                            <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
                                <tr>
                                    <td>
                                        <table role="presentation" cellspacing="0" cellpadding="0" border="0">
                                            <tr>
                                                <td style="width: 40px; height: 40px; background: linear-gradient(135deg, #7C3AED 0%, #9333EA 100%); border-radius: 10px; text-align: center; vertical-align: middle;">
                                                    <span style="color: #ffffff; font-weight: bold; font-size: 18px; line-height: 40px;">H</span>
                                                </td>
                                                <td style="padding-left: 12px;">
                                                    <span style="font-size: 20px; font-weight: 700; color: #7C3AED;">HiddenJobs</span>
                                                </td>
                                            </tr>
                                        </table>
                                    </td>
                                    <td align="right">
                                        <span style="font-size: 12px; color: #9ca3af;">{% block header_badge %}{% endblock %}</span>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                    
                    <!-- Content -->
                    {% block content %}{% endblock %}
                    
                    <!-- Divider -->
                    <tr>
                        <td style="padding: 0 32px;" class="mobile-padding">
                            <div style="height: 1px; background: #e5e7eb;"></div>
                        </td>
                    </tr>
                    
                    <!-- Footer -->
                    <tr>
                        <td style="padding: 24px 32px;" class="mobile-padding">
                            <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
                                <tr>
                                    <td align="center">
                                        <p style="margin: 0 0 12px; color: #9ca3af; font-size: 12px;">
                                            {% block footer_text %}You're receiving this because you have notifications enabled.{% endblock %}
                                        </p>
                                        <p style="margin: 0;">
                                            <a href="{{ base_url }}/settings/alerts" style="color: #7c3aed; text-decoration: none; font-size: 12px; font-weight: 500;">Manage Alerts</a>
                                            <span style="color: #d1d5db; margin: 0 8px;">•</span>
                                            <a href="{{ base_url }}/settings/notifications" style="color: #7c3aed; text-decoration: none; font-size: 12px; font-weight: 500;">Unsubscribe</a>
                                            <span style="color: #d1d5db; margin: 0 8px;">•</span>
                                            <a href="{{ base_url }}" style="color: #7c3aed; text-decoration: none; font-size: 12px; font-weight: 500;">Visit HiddenJobs</a>
                                        </p>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                    
                    <!-- Copyright -->
                    <tr>
                        <td style="padding: 0 32px 24px;" class="mobile-padding">
                            <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
                                <tr>
                                    <td align="center">
                                        <p style="margin: 0; color: #d1d5db; font-size: 11px;">
                                            © {{ current_year }} HiddenJobs. Made with 💜 in Israel.
                                        </p>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                    
                </table>
                
            </td>
        </tr>
    </table>
    
</body>
</html>
