user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/rss+xml font/truetype font/opentype 
               application/vnd.ms-fontobject image/svg+xml;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_status 429;

    # Docker's internal DNS resolver - enables dynamic IP resolution
    # This is critical: without this, nginx caches IPs at startup and
    # won't pick up new container IPs after deployments
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # HTTP server - redirect to HTTPS (optional, for when SSL is configured)
    server {
        listen 80;
        server_name _;

        # For Let's Encrypt challenges
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Uncomment to redirect all HTTP to HTTPS
        # location / {
        #     return 301 https://$host$request_uri;
        # }

        # Comment out this location block when using HTTPS redirect
        location / {
            # Rate limiting
            limit_req zone=api_limit burst=20 nodelay;

            # Use variable to force DNS re-resolution on each request
            # Without this, nginx caches the IP from the upstream block
            set $api_backend "http://api:8000";

            # Proxy settings
            proxy_pass $api_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # ============================================================
            # IMPORTANT: DO NOT ADD CORS HEADERS HERE!
            # ============================================================
            # CORS is handled by FastAPI middleware in src/api/app.py
            # Adding CORS headers here will cause duplicate headers which
            # browsers will reject with error:
            # "The 'Access-Control-Allow-Origin' header contains multiple values"
            # ============================================================
        }

        # Health check endpoint (no rate limiting)
        location /health {
            set $api_health "http://api:8000";
            proxy_pass $api_health/health;
            access_log off;
        }
    }

    # HTTPS server (uncomment when SSL certificates are configured)
    # server {
    #     listen 443 ssl http2;
    #     server_name your-domain.com;
    #
    #     ssl_certificate /etc/nginx/ssl/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers HIGH:!aNULL:!MD5;
    #     ssl_prefer_server_ciphers on;
    #
    #     location / {
    #         limit_req zone=api_limit burst=20 nodelay;
    #
    #         proxy_pass http://api_backend;
    #         proxy_http_version 1.1;
    #         proxy_set_header Upgrade $http_upgrade;
    #         proxy_set_header Connection 'upgrade';
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto $scheme;
    #         proxy_cache_bypass $http_upgrade;
    #
    #         proxy_connect_timeout 60s;
    #         proxy_send_timeout 60s;
    #         proxy_read_timeout 60s;
    #     }
    #
    #     location /health {
    #         proxy_pass http://api_backend/health;
    #         access_log off;
    #     }
    # }
}

